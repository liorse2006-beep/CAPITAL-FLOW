name: Keep-alive ping

on:
  schedule:
    # Wake the production and independent status services every five minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-main:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 5 "${{ secrets.RENDER_URL }}/health" --max-time 60

  ping-independent-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check independent status service on its Render origin
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 "https://status-capital-flow.onrender.com/health" --max-time 90
      - name: Check independent status service on its public domain
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 "https://status.capitalflow.vip/health" --max-time 90

  external-status-watchdog:
    # This job is deliberately outside the status service. If the independent
    # process/container itself is down, its own watchdog cannot send an email;
    # GitHub Actions remains a separate failure detector at no additional app
    # infrastructure cost.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify status host is answering with a healthy heartbeat
        id: probe
        continue-on-error: true
        run: |
          status_code=$(curl --silent --show-error --output /tmp/status-health.json --write-out '%{http_code}' --retry 2 --retry-all-errors --retry-delay 5 'https://status.capitalflow.vip/health' --max-time 45 || true)
          echo "http_status=${status_code}" >> "$GITHUB_OUTPUT"
          if [ "$status_code" != "200" ]; then
            echo "Independent status host returned HTTP ${status_code}"
            cat /tmp/status-health.json || true
            exit 1
          fi
      - name: Deduplicate external watchdog incidents
        id: incident-state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title='Independent status host unreachable'
          open_count=$(gh issue list --state open --search "in:title ${title}" --json number --jq 'length')
          if [ "${{ steps.probe.outcome }}" = "failure" ]; then
            if [ "$open_count" = "0" ]; then
              gh issue create --title "$title" --body 'The external keep-alive watchdog observed a non-200 response from https://status.capitalflow.vip/health. This issue is used as a durable deduplication marker until recovery.' >/dev/null
              echo 'send_alert=true' >> "$GITHUB_OUTPUT"
            else
              echo 'send_alert=false' >> "$GITHUB_OUTPUT"
            fi
            echo 'send_recovery=false' >> "$GITHUB_OUTPUT"
          elif [ "$open_count" != "0" ]; then
            echo 'send_alert=false' >> "$GITHUB_OUTPUT"
            echo 'send_recovery=true' >> "$GITHUB_OUTPUT"
          else
            echo 'send_alert=false' >> "$GITHUB_OUTPUT"
            echo 'send_recovery=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Send an external watchdog email when the status host is down
        if: steps.incident-state.outputs.send_alert == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STATUS_ALERT_RECIPIENTS: ${{ secrets.STATUS_ALERT_RECIPIENTS }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_FROM_EMAIL" ] || [ -z "$STATUS_ALERT_RECIPIENTS" ]; then
            echo 'External watchdog email skipped: one or more repository secrets are not configured.'
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          recipients = [item.strip() for item in os.environ['STATUS_ALERT_RECIPIENTS'].split(',') if item.strip()]
          payload = json.dumps({
              'from': os.environ['RESEND_FROM_EMAIL'],
              'to': recipients,
              'subject': '[Capital Flow] MONITORING HOST DOWN',
              'text': 'The independent status host did not return HTTP 200. Check the status service deployment, DNS, Render health, and the status database. This alert was generated by the external GitHub Actions watchdog.',
          }).encode()
          request = urllib.request.Request('https://api.resend.com/emails', data=payload, headers={
              'Authorization': 'Bearer ' + os.environ['RESEND_API_KEY'],
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode())
          PY
      - name: Send one external recovery email
        id: recovery-email
        if: steps.incident-state.outputs.send_recovery == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          STATUS_ALERT_RECIPIENTS: ${{ secrets.STATUS_ALERT_RECIPIENTS }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_FROM_EMAIL" ] || [ -z "$STATUS_ALERT_RECIPIENTS" ]; then
            echo '::warning::External recovery email skipped: one or more repository secrets are not configured.'
            echo 'The status host is healthy again; configure RESEND_API_KEY, RESEND_FROM_EMAIL and STATUS_ALERT_RECIPIENTS to enable recovery email.'
            exit 0
          else
          python - <<'PY'
          import json, os, urllib.request
          recipients = [item.strip() for item in os.environ['STATUS_ALERT_RECIPIENTS'].split(',') if item.strip()]
          payload = json.dumps({
              'from': os.environ['RESEND_FROM_EMAIL'],
              'to': recipients,
              'subject': '[Capital Flow] RESOLVED — monitoring host reachable again',
              'text': 'The independent status host is responding with HTTP 200 again. The external watchdog incident has recovered.',
          }).encode()
          request = urllib.request.Request('https://api.resend.com/emails', data=payload, headers={
              'Authorization': 'Bearer ' + os.environ['RESEND_API_KEY'],
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.read().decode())
          PY
          fi
      - name: Close the external watchdog incident after recovery
        if: steps.incident-state.outputs.send_recovery == 'true' && steps.recovery-email.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --state open --search 'in:title Independent status host unreachable' --json number --jq '.[].number' | while read -r issue; do
            [ -z "$issue" ] || gh issue close "$issue" --comment 'The external watchdog observed a healthy HTTP 200 response again.'
          done
      - name: Fail the watchdog job when the status host is unhealthy
        if: steps.probe.outcome == 'failure'
        run: |
          echo 'STATUS ALERT: configure RESEND_API_KEY, RESEND_FROM_EMAIL and STATUS_ALERT_RECIPIENTS repository secrets if the external email step was skipped.'
          exit 1
