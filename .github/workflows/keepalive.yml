name: Keep-alive ping

on:
  schedule:
    # Every 10 minutes — a lightweight uptime check for the paid Render service.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error "${{ secrets.RENDER_URL }}/health" --max-time 30
