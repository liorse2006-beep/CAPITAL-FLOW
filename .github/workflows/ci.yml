name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            npm ci && exit 0
            echo "npm ci failed; retrying in $((attempt * 10))s (attempt $attempt/5)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run backend test suite
        run: node --test --test-concurrency=1 test/*.test.js
        env:
          JWT_SECRET: ci-jwt-secret-123456789012345678901234567890
          SESSION_SECRET: ci-session-secret-123456789012345678901234567890
          TURSO_DB_URL: 'file::memory:'
          RESEND_API_KEY: ''
          TURNSTILE_SECRET: ''
          HCAPTCHA_SECRET: ''

      - name: Run frontend test suite
        run: npx vitest run

      - name: Run Cloudflare Worker tests
        run: npm run test:worker

      - name: Run lint
        run: npm run lint

      - name: Check formatting for changed files
        run: node scripts/check-changed-format.cjs "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies for high/critical vulnerabilities
        # registry.npmjs.org's advisories/bulk endpoint has hit transient
        # network timeouts in practice, unrelated to the actual dependency
        # tree — same retry shape as the npm ci step above, which already
        # exists for exactly this class of flakiness. See deploy.yml's
        # matching step for the full incident notes.
        run: |
          for attempt in 1 2 3 4 5; do
            npm audit --omit=dev --audit-level=high && exit 0
            echo "npm audit failed (possibly a transient registry timeout); retrying in $((attempt * 10))s (attempt $attempt/5)"
            sleep $((attempt * 10))
          done
          exit 1

  isolated-capacity:
    # This bounded synthetic test has no production URL, customer data or secrets.
    # Never run it on paid/larger runners or if the repository becomes private.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Linux dependencies without production secrets
        run: npm ci --omit=dev

      - name: Measure isolated warm routes under the Starter resource envelope
        run: |
          fixture=capital-flow-capacity-fixture
          trap 'docker logs "$fixture"; docker stop --time 10 "$fixture" >/dev/null; docker rm "$fixture" >/dev/null' EXIT
          docker run --detach --name "$fixture" --init --network none --read-only \
            --cpus 0.5 --memory 512m --memory-swap 512m \
            --tmpfs /tmp:rw,nosuid,nodev,size=96m \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            node:22-bookworm-slim node scripts/isolated-capacity-audit.cjs --serve-fixture
          # Sharing the offline loopback namespace permits only local fixture traffic.
          # The generator has a separate CPU budget; application measurements exclude it.
          docker run --rm --init --network "container:$fixture" --read-only \
            --cpus 1 --memory 512m --memory-swap 512m \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            node:22-bookworm-slim node scripts/capacity-audit-load.cjs
