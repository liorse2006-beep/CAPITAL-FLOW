name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            npm ci && exit 0
            echo "npm ci failed; retrying in $((attempt * 10))s (attempt $attempt/5)"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Run backend test suite
        run: node --test --test-concurrency=1 test/*.test.js
        env:
          JWT_SECRET: ci-jwt-secret-123456789012345678901234567890
          SESSION_SECRET: ci-session-secret-123456789012345678901234567890
          TURSO_DB_URL: 'file::memory:'
          RESEND_API_KEY: ''
          TURNSTILE_SECRET: ''
          HCAPTCHA_SECRET: ''

      - name: Run frontend test suite
        run: npx vitest run

      - name: Run Cloudflare Worker tests
        run: npm run test:worker

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies for high/critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
