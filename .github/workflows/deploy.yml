name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Tests must pass before any deploy ──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for attempt in 1 2 3 4 5; do
            npm ci && exit 0
            echo "npm ci failed; retrying in $((attempt * 10))s (attempt $attempt/5)"
            sleep $((attempt * 10))
          done
          exit 1
      - run: node --test --test-concurrency=1 test/*.test.js
        env:
          JWT_SECRET: ci-jwt-secret-123456789012345678901234567890
          SESSION_SECRET: ci-session-secret-123456789012345678901234567890
          TURSO_DB_URL: 'file::memory:'
          RESEND_API_KEY: ''
          TURNSTILE_SECRET: ''
          HCAPTCHA_SECRET: ''
      - run: npx vitest run
      - run: npm run test:worker
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=critical

  # ── 2. Trigger Render redeploy via deploy hook ────────────────────────────
  deploy:
    needs: test
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: curl --fail --silent --show-error -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" --max-time 30
