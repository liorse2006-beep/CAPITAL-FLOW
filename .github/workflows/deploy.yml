name: Deploy

on:
  push:
    branches: [main]

jobs:
  # ── 1. Tests must pass before any deploy ──────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: node --test --test-concurrency=1 test/*.test.js
        env:
          JWT_SECRET: ci-jwt-secret-123456789012345678901234567890
          SESSION_SECRET: ci-session-secret-123456789012345678901234567890
          TURSO_DB_URL: 'file::memory:'
          RESEND_API_KEY: ''
          TURNSTILE_SECRET: ''
          HCAPTCHA_SECRET: ''
      - run: npx vitest run
      - run: npm run build

  # ── 2. Trigger Render redeploy via deploy hook ────────────────────────────
  deploy:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" --max-time 30)
          echo "Render deploy hook status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
            echo "Warning: deploy hook returned $STATUS"
          fi
