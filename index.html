<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- Chrome/Edge can fire beforeinstallprompt as soon as it decides the
         page is installable — on a first visit from a new device this can
         happen before React has mounted and useInstallPrompt's own listener
         is attached, silently dropping the event and the install prompt
         with it. Capturing it here, before anything else loads, means it's
         never missed regardless of how long the JS bundle takes to parse. -->
    <script>
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__vsDeferredInstallPrompt = e;
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capital Flow — לראות מה זז בשוק</title>
    <meta
      name="description"
      content="Capital Flow עוזר לך לסרוק את השוק, למצוא מניות עם תנועה חריגה ולפתוח בדיקה מסודרת — בלי לעבור על עשרות טאבים. מתחילים ב־7 ימים בחינם."
    />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="canonical" href="https://capitalflow.vip/" />
    <meta property="og:title" content="Capital Flow — לראות מה זז בשוק" />

      property="og:description"
      content="פחות חיפוש ידני, יותר דרך ברורה להתחיל לבדוק את השוק. נסה את Capital Flow ב־7 ימים בחינם."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://capitalflow.vip/" />
    <meta property="og:image" content="https://capitalflow.vip/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="robots" content="index, follow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Use the approved Capital Flow mark everywhere the browser asks for
         an app identity. The old favicon.svg was only a temporary bar-chart
         placeholder and is not the product logo. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Fonts are self-hosted (see @font-face in src/styles/index.css) — no
         external CDN. Preload the two faces on the critical first-paint path:
         Switzer 400 (body/UI text) and JetBrains Mono (every number in the
         scanner table). The browser fetches them in parallel with the CSS
         instead of discovering them only after the stylesheet parses. -->
    <link rel="preload" href="/fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Start the landing marquee's logo requests before React mounts so the
         first visible frame is populated instead of waiting on JS effects. -->
    <link
      rel="preload"
      as="image"
      type="image/svg+xml"
      href="https://assets.parqet.com/logos/symbol/AAPL?format=svg&amp;size=32"
